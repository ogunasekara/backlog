name: Keep-alive

# Supabase pauses a free-tier project after about a week without activity. This calls
# a tiny database function (the keepalive migration) twice a week, so a missed or late
# run still lands inside the week. GitHub turns off scheduled workflows after 60 days
# without a commit; re-enable it from the Actions tab if that happens.
on:
  schedule:
    - cron: '17 6 * * 1,4' # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive()
        env:
          # The same public repository variables the Android release uses.
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "::error::Missing repository variables VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
