name: Android release

# Push a tag like v0.3.0 to build, sign, and attach the APK to a GitHub Release.
# Run it by hand (Actions → Android release → Run workflow) for a dry run: same signed
# build, uploaded as a workflow artifact instead of a release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build and sign APK
    runs-on: ubuntu-latest
    env:
      # Public by design (they ship inside the app); stored as repository variables.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-dryrun.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "::error::Tag must look like v1.2.3 (got $GITHUB_REF_NAME)"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch must be 0-99 to fit the version code"; exit 1
          fi
          # Android refuses to install a lower versionCode over a higher one, so it must
          # grow with every release: v1.2.3 → 10203. Dry runs are never installed over releases.
          code=$(( major * 10000 + minor * 100 + patch ))
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then code=1; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Check configuration
        # Named exactly as in GitHub, so the error lists what to add.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing_vars=() missing_secrets=()
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_GOOGLE_WEB_CLIENT_ID; do
            [[ -n "${!name}" ]] || missing_vars+=("$name")
          done
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
                      ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing_secrets+=("$name")
          done
          if (( ${#missing_vars[@]} )); then
            echo "::error::Missing repository variables (Actions → Variables tab): ${missing_vars[*]}"
          fi
          if (( ${#missing_secrets[@]} )); then
            echo "::error::Missing repository secrets (Actions → Secrets tab): ${missing_secrets[*]}"
          fi
          if (( ${#missing_vars[@]} + ${#missing_secrets[@]} )); then
            echo "Environment, Codespaces, and Dependabot values are not visible here (see docs/self-hosting.md)."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Shown in Settings; see vite.config.ts.
          APP_VERSION: v${{ steps.version.outputs.name }}
      - run: pnpm exec cap sync android

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease --no-daemon
          -PversionCode=${{ steps.version.outputs.code }}
          -PversionName=${{ steps.version.outputs.name }}

      - name: Verify the signature
        id: apk
        run: |
          apk="backlog-v${{ steps.version.outputs.name }}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --generate-notes

      - name: Upload the dry-run APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
