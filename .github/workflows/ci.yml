name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  rls:
    name: RLS tests (local Supabase)
    runs-on: ubuntu-latest
    steps:
      # Supabase's ports sit in Linux's ephemeral range, so an outbound connection (the
      # image pulls make many) can take one just before Docker binds it.
      - name: Reserve the Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (db, auth, rest only)
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: pnpm test:rls

  e2e:
    name: End-to-end tests (Playwright, local Supabase)
    # Slow, so it runs on pushes to main only; run `pnpm test:e2e` locally before merging.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # See the rls job.
      - name: Reserve the Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start Supabase (db, auth, rest, mail only)
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
